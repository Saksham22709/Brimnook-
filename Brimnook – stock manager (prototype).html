<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brimnook – stock manager (prototype)</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#16202e;--mute:#5d6b7e;--line:#dde3ea;--acc:#0e7c6b;--acc-ink:#fff;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b42318;--bad-bg:#fee4e2;--ok:#05603a;--ok-bg:#d1fadf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--card:#18222f;--ink:#e8edf3;--mute:#93a1b4;--line:#2a3646;--acc:#2fb8a3;--acc-ink:#06201b;--warn:#fbbf24;--warn-bg:#3b2a0a;--bad:#fda29b;--bad-bg:#42191a;--ok:#75e0a7;--ok-bg:#0d3a24}}
:root[data-theme="dark"]{--bg:#0f1620;--card:#18222f;--ink:#e8edf3;--mute:#93a1b4;--line:#2a3646;--acc:#2fb8a3;--acc-ink:#06201b;--warn:#fbbf24;--warn-bg:#3b2a0a;--bad:#fda29b;--bad-bg:#42191a;--ok:#75e0a7;--ok-bg:#0d3a24}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:84px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{display:flex;align-items:center;gap:10px;padding:14px 0 8px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em}
.tag{font-size:11px;font-weight:700;background:var(--warn-bg);color:var(--warn);padding:2px 8px;border-radius:99px}
header .sp{flex:1}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
h2{font-size:18px;margin:18px 0 8px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 13px;min-height:42px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.dng{color:var(--bad)}
button.sm{min-height:36px;padding:6px 11px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{color:var(--mute);font-size:13px}
.stat.low b{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .sp{flex:1}
.nm{font-weight:650}
.meta{color:var(--mute);font-size:13px}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-low{background:var(--warn-bg);color:var(--warn)}.b-out{background:var(--bad-bg);color:var(--bad)}
.qty{display:flex;align-items:center;gap:6px}
.qty output{min-width:34px;text-align:center;font-weight:700;font-size:17px}
.alert{border-left:4px solid var(--warn)}
.alert.out{border-left-color:var(--bad)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tools input[type=search]{grid-column:1/-1}
input,select{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:56px;color:var(--mute);font-size:13px}
nav button[aria-current=page]{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:99px;padding:12px 18px}
.modal{position:fixed;inset:0;background:rgba(10,16,24,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
label input{margin-top:4px;color:var(--ink)}
.err{color:var(--bad);font-size:13px;margin:0 0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20}
.hist{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border:0}
.d{font-weight:700;min-width:44px;text-align:right}.d.p{color:var(--ok)}.d.n{color:var(--bad)}
.tw{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">Brimnook</span><span class="tag">PROTOTYPE</span><span class="sp"></span>
    <button class="sm" data-act="reset" aria-label="Reset demo data">Reset demo</button>
  </header>
  <div class="banner"><b>Prototype only, not a production service.</b> There is no login, cloud sync or backend. Data stays in this browser on this device<span id="stnote"></span>.</div>
  <main id="app"></main>
</div>
<nav aria-label="Main">
  <button data-nav="dash">Dashboard</button>
  <button data-nav="prod">Products</button>
  <button data-nav="hist">History</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>
<script>
(function(){
var KEY='brimnook-prototype-v1', CUR='₹';
var S={products:[],history:[]}, U={view:'dash',q:'',st:'all',sz:'all'}, canStore=true, tt;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return CUR+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function ago(d){return new Date(Date.now()-d*864e5-Math.random()*3e7).toISOString()}
function fdate(iso){var d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}

function seed(){
  var raw=[['Linen Shirt','LS-001','M','Sand',24,1499,6],['Linen Shirt','LS-002','L','Sand',5,1499,6],['Denim Jacket','DJ-010','M','Indigo',9,3299,4],['Denim Jacket','DJ-011','L','Indigo',3,3299,4],['Cotton Tee','CT-101','S','White',40,499,10],['Cotton Tee','CT-102','M','White',12,499,10],['Cotton Tee','CT-103','M','Black',0,549,10],['Wool Beanie','WB-201','One size','Grey',18,399,5],['Chino Trousers','CH-301','32','Olive',7,1799,5],['Floral Kurta','FK-401','M','Teal',4,1299,5],['Summer Dress','SD-501','S','Coral',15,1999,4],['Hoodie','HD-601','XL','Charcoal',6,2199,5]];
  S.products=raw.map(function(r){return {id:uid(),name:r[0],sku:r[1],size:r[2],color:r[3],qty:r[4],price:r[5],thr:r[6]}});
  S.history=[];
  var acts=[['Stock added',1],['Stock removed',-1]];
  for(var i=0;i<14;i++){var p=S.products[(i*5)%S.products.length],a=acts[i%2],n=2+(i*3)%7;
    S.history.push({id:uid(),name:p.name+' ('+p.size+', '+p.color+')',sku:p.sku,action:a[0],delta:a[1]*n,date:ago(i*.7+.1)});}
  S.history.sort(function(a,b){return b.date<a.date?-1:1});
}
function save(){if(!canStore)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canStore=false;note()}}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.products)&&Array.isArray(d.history)){S=d;return}}}
  catch(e){canStore=false}
  seed();save();
}
function note(){$('#stnote').textContent=canStore?'':' (browser storage is unavailable here, so changes will be lost on reload)'}
function toast(m){var t=$('#toast');t.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(tt);tt=setTimeout(function(){t.innerHTML=''},2200)}

function status(p){return p.qty<=0?'out':(p.qty<=p.thr?'low':'ok')}
function badge(p){var s=status(p);return '<span class="badge b-'+s+'">'+(s==='out'?'Out of stock':s==='low'?'Low stock':'In stock')+'</span>'}
function label(p){return p.name+' ('+p.size+', '+p.color+')'}
function log(p,action,delta){S.history.unshift({id:uid(),name:label(p),sku:p.sku,action:action,delta:delta,date:new Date().toISOString()})}
function find(id){return S.products.filter(function(p){return p.id===id})[0]}

function adjust(id,d){
  var p=find(id);if(!p)return;var n=Math.max(0,p.qty+d),real=n-p.qty;if(!real)return;
  p.qty=n;log(p,real>0?'Stock added':'Stock removed',real);save();render();
  if(status(p)!=='ok')toast(label(p)+' is '+(p.qty?'low on stock':'out of stock'));
}

function render(){
  document.querySelectorAll('nav button').forEach(function(b){b.getAttribute('data-nav')===U.view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  var h='';
  if(U.view==='dash')h=dash();else if(U.view==='prod')h=prodView();else h=histView();
  $('#app').innerHTML=h;
  if(U.view==='prod')list();
}
function dash(){
  var units=S.products.reduce(function(a,p){return a+p.qty},0);
  var low=S.products.filter(function(p){return status(p)!=='ok'}).sort(function(a,b){return a.qty-b.qty});
  var value=S.products.reduce(function(a,p){return a+p.qty*p.price},0);
  var h='<div class="grid"><div class="stat"><b>'+S.products.length+'</b><span>Products</span></div><div class="stat"><b>'+units+'</b><span>Total units</span></div><div class="stat low"><b>'+low.length+'</b><span>Low-stock items</span></div></div>';
  h+='<p class="meta" style="margin:8px 2px 0">Stock value at selling price: <b>'+money(value)+'</b></p>';
  h+='<h2>Low-stock alerts</h2>';
  if(!low.length)h+='<div class="card empty">All products are above their thresholds.</div>';
  low.forEach(function(p){h+='<div class="card alert'+(p.qty?'':' out')+'"><div class="row"><div class="sp"><div class="nm">'+esc(label(p))+'</div><div class="meta">'+esc(p.sku)+' · '+p.qty+' left · alert at '+p.thr+'</div></div>'+badge(p)+'<button class="sm pri" data-restock="'+p.id+'">Restock +10</button></div></div>'});
  h+='<h2>Recent activity</h2><div class="card">'+histRows(S.history.slice(0,5))+'</div>';
  return h;
}
function histRows(a){
  if(!a.length)return '<div class="empty">No stock changes yet.</div>';
  return a.map(function(x){return '<div class="hist"><div class="sp" style="flex:1;min-width:0"><div class="nm">'+esc(x.name)+'</div><div class="meta">'+esc(x.action)+' · '+fdate(x.date)+'</div></div><div class="d '+(x.delta>0?'p':'n')+'">'+(x.delta>0?'+':'')+x.delta+'</div></div>'}).join('');
}
function histView(){
  return '<h2>Stock history</h2><div class="card">'+histRows(S.history)+'</div>'+(S.history.length?'<button class="sm dng" data-act="clearhist">Clear history</button>':'');
}
function prodView(){
  var sizes=[];S.products.forEach(function(p){if(sizes.indexOf(p.size)<0)sizes.push(p.size)});
  var o=function(v,t,c){return '<option value="'+esc(v)+'"'+(c===v?' selected':'')+'>'+esc(t)+'</option>'};
  return '<h2>Products</h2><div class="tools"><input type="search" id="q" placeholder="Search name, SKU or color" aria-label="Search products" value="'+esc(U.q)+'">'
   +'<select id="st" aria-label="Filter by status">'+o('all','All statuses',U.st)+o('ok','In stock',U.st)+o('low','Low stock',U.st)+o('out','Out of stock',U.st)+'</select>'
   +'<select id="sz" aria-label="Filter by size">'+o('all','All sizes',U.sz)+sizes.map(function(s){return o(s,s,U.sz)}).join('')+'</select></div>'
   +'<div id="plist"></div><button class="pri fab" data-act="add">+ Add product</button>';
}
function list(){
  var q=U.q.trim().toLowerCase();
  var r=S.products.filter(function(p){
    if(q&&(p.name+' '+p.sku+' '+p.color).toLowerCase().indexOf(q)<0)return false;
    if(U.st==='low'?status(p)!=='low':U.st==='out'?status(p)!=='out':U.st==='ok'?status(p)!=='ok':false)return false;
    if(U.sz!=='all'&&p.size!==U.sz)return false;return true});
  var h=r.length?'':'<div class="card empty">'+(S.products.length?'No products match these filters.':'No products yet. Tap “Add product” to create one.')+'</div>';
  r.forEach(function(p){h+='<div class="card"><div class="row"><div class="sp"><div class="nm">'+esc(p.name)+'</div><div class="meta">'+esc(p.sku)+' · '+esc(p.size)+' · '+esc(p.color)+'</div></div>'+badge(p)+'</div>'
   +'<div class="row" style="margin-top:8px"><div class="qty"><button class="sm" data-adj="-1" data-id="'+p.id+'" aria-label="Remove one unit">−</button><output>'+p.qty+'</output><button class="sm" data-adj="1" data-id="'+p.id+'" aria-label="Add one unit">+</button></div>'
   +'<div class="sp meta">'+money(p.price)+' · alert at '+p.thr+'</div><button class="sm" data-edit="'+p.id+'">Edit</button><button class="sm dng" data-del="'+p.id+'">Delete</button></div></div>'});
  $('#plist').innerHTML=h;
}

function openForm(id){
  var p=id?find(id):{name:'',sku:'',size:'',color:'',qty:0,price:'',thr:5};
  var f=function(k,l,t,x){return '<label>'+l+'<input name="'+k+'" type="'+(t||'text')+'" value="'+esc(p[k])+'" '+(x||'')+'></label>'};
  $('#modal').innerHTML='<div class="modal" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+(id?'Edit':'Add')+' product"><h2 style="margin-top:0">'+(id?'Edit product':'Add product')+'</h2>'
   +'<div id="ferr"></div><form id="pf" novalidate>'+f('name','Name')+'<div class="f2">'+f('sku','SKU')+f('size','Size')+f('color','Color')+f('qty','Quantity','number','min="0" step="1" inputmode="numeric"')+f('price','Selling price ('+CUR+')','number','min="0" step="0.01" inputmode="decimal"')+f('thr','Low-stock threshold','number','min="0" step="1" inputmode="numeric"')+'</div>'
   +'<div class="row" style="justify-content:flex-end"><button type="button" data-close="1">Cancel</button><button type="submit" class="pri">'+(id?'Save changes':'Add product')+'</button></div></form></div></div>';
  $('#pf').addEventListener('submit',function(e){e.preventDefault();submitForm(id)});
  var n=$('#pf [name=name]');if(n)n.focus();
}
function submitForm(id){
  var g=function(k){return $('#pf [name='+k+']').value.trim()};
  var v={name:g('name'),sku:g('sku').toUpperCase(),size:g('size'),color:g('color'),qty:g('qty'),price:g('price'),thr:g('thr')},e=[];
  ['name','sku','size','color'].forEach(function(k){if(!v[k])e.push('Enter a value for '+(k==='sku'?'SKU':k)+'.')});
  var qn=Number(v.qty),pn=Number(v.price),tn=Number(v.thr);
  if(v.qty===''||!Number.isInteger(qn)||qn<0)e.push('Quantity must be a whole number, 0 or more.');
  if(v.price===''||isNaN(pn)||pn<0)e.push('Selling price must be a number, 0 or more.');
  if(v.thr===''||!Number.isInteger(tn)||tn<0)e.push('Threshold must be a whole number, 0 or more.');
  if(v.sku&&S.products.some(function(p){return p.sku===v.sku&&p.id!==id}))e.push('That SKU is already used by another product.');
  if(e.length){$('#ferr').innerHTML=e.map(function(m){return '<p class="err" role="alert">'+esc(m)+'</p>'}).join('');return}
  if(id){var p=find(id),old=p.qty;p.name=v.name;p.sku=v.sku;p.size=v.size;p.color=v.color;p.qty=qn;p.price=pn;p.thr=tn;
    if(qn!==old)log(p,'Edited quantity',qn-old);toast('Changes saved')}
  else{var np={id:uid(),name:v.name,sku:v.sku,size:v.size,color:v.color,qty:qn,price:pn,thr:tn};S.products.push(np);log(np,'Product added',qn);toast('Product added')}
  save();closeModal();render();
}
function closeModal(){$('#modal').innerHTML=''}
function confirmBox(title,msg,btn,fn){
  $('#modal').innerHTML='<div class="modal" data-close="1"><div class="sheet" role="alertdialog" aria-modal="true" aria-label="'+esc(title)+'"><h2 style="margin-top:0">'+esc(title)+'</h2><p>'+esc(msg)+'</p><div class="row" style="justify-content:flex-end"><button data-close="1">Cancel</button><button class="pri dng" id="cok" style="background:var(--bad);border-color:var(--bad);color:#fff">'+esc(btn)+'</button></div></div></div>';
  $('#cok').addEventListener('click',function(){closeModal();fn()});
}

document.addEventListener('click',function(e){
  var t=e.target;
  if(t.getAttribute&&t.getAttribute('data-close')&&(t.tagName==='BUTTON'||t.classList.contains('modal'))){closeModal();return}
  var b=t.closest('button');if(!b)return;
  var d=function(k){return b.getAttribute('data-'+k)};
  if(d('nav')){U.view=d('nav');render();window.scrollTo(0,0)}
  else if(d('adj'))adjust(d('id'),Number(d('adj')));
  else if(d('restock'))adjust(d('restock'),10);
  else if(d('edit'))openForm(d('edit'));
  else if(d('del')){var p=find(d('del'));confirmBox('Delete product?','“'+label(p)+'” will be removed from your inventory. Its past history entries stay.','Delete',function(){log(p,'Product deleted',-p.qty);S.products=S.products.filter(function(x){return x.id!==p.id});save();render();toast('Product deleted')})}
  else if(d('act')==='add')openForm();
  else if(d('act')==='reset')confirmBox('Reset demo data?','This replaces everything in this browser with the original sample products and history.','Reset demo',function(){seed();save();U={view:U.view,q:'',st:'all',sz:'all'};render();toast('Demo data restored')});
  else if(d('act')==='clearhist')confirmBox('Clear history?','All stock history entries will be deleted. Product quantities stay as they are.','Clear history',function(){S.history=[];save();render();toast('History cleared')});
});
document.addEventListener('input',function(e){if(e.target.id==='q'){U.q=e.target.value;list()}});
document.addEventListener('change',function(e){if(e.target.id==='st'){U.st=e.target.value;list()}if(e.target.id==='sz'){U.sz=e.target.value;list()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){canStore=false}
load();note();render();
})();
</script>
</body>
</html>
